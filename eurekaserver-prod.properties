# Production/Docker Environment Properties
spring.config.import=optional:configserver:http://configserver:8071/

# Eureka Instance Configuration for Docker
eureka.instance.hostname=eurekaserver
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Production optimized settings
eureka.server.response-cache-update-interval-ms=30000
eureka.server.eviction-interval-timer-in-ms=60000
eureka.server.renewal-percent-threshold=0.85

# Network timeouts for production
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Docker container health checks
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Production logging
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO